[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh"
version = "0.0.1"
description = "services/mesh — processamento de malha, torso sintetico e antropometria do simulador de mamoplastia (mm, quadro anatomico, contrato 1.0)"
requires-python = ">=3.11"
license = { text = "Proprietario (dependencias: apenas MIT/BSD/Apache-2.0 e equivalentes; ver THIRD_PARTY_LICENSES.md)" }
dependencies = [
  "numpy>=1.26",               # BSD-3
  "scipy>=1.11",               # BSD-3
  "trimesh>=4.0",              # MIT  (leitura OBJ/PLY)
  "rtree>=1.0",                # MIT  (indice espacial usado pelo trimesh)
  "fast-simplification>=0.1.7",# MIT  (decimacao por quadricas; alternativas GPL proibidas, ADR 0009)
  "pygeodesic>=0.1.8",         # MIT  (geodesica exata MMP, Kirsanov — MIT)
  "fastapi>=0.110",            # MIT
  "uvicorn>=0.27",             # BSD-3
  "pydantic>=2.5",             # MIT
  "Pillow>=10.0",              # MIT-CMU (HPND)
  "jsonschema>=4.20",          # MIT
]

[project.optional-dependencies]
dev = [
  "pytest>=8",                 # MIT
  "httpx>=0.27",               # BSD-3 (TestClient do FastAPI)
  "ruff>=0.5",                 # MIT
  "pip-licenses>=4.3",         # MIT
]

[tool.setuptools.packages.find]
include = ["mesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806", "E741", "N818"]
